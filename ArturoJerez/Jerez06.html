<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatomon</title>
</head>
<body>
    <style>
        body {
            background-image: url(pokedex.jpg);
            background-size: cover;
            background-repeat: no-repeat;
        }
        button {
            width: 100px;
            height: 100px;
            background-color: rgb(255, 85, 0);
            border-color: rgb(0, 0, 0);
            border-radius: 50px;
            position: absolute;
            top: 400px;
            left: 500px;
        }
        button:hover {
            background-color: rgb(255, 255, 255);
        }
        .pokeImg{
            position: absolute;
            background-color: transparent;
            z-index: 1;
            width: 250px;
            height: 250px;
            left: 200px;
            mix-blend-mode: multiply;
        }
        .placeholder {
            width: 200px;
            height: 50px;
            position: absolute;
            border-radius: 10px;
            background-color: transparent;
            text-align: center;
            text-shadow: 2px;
            font-size: 25px;
            z-index: 2;
            top: 300px;
        }
        .pokeimg1 {
            position: absolute;
            color: yellow;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 25px;
        }
    </style>
    <input type="text" placeholder="Mon" id="PokeName" class="placeholder">
    <img src="pokeball.jpg" alt="Pokeball" id="pokeImg" class="pokeImg">

    <div id="pokename" class="pokeimg1" style="top: 100px; left: 500px;">Nombre del Pokemon</div>
    <div id="pokeHe" class="pokeimg1" style="top: 180px; left: 500px;">Altura del Pokemon</div>
    <div id="pokeWe" class="pokeimg1" style="top: 360px; left: 500px;">Peso del Pokemon</div>
    <div id="poketype" class="pokeimg1" style="top: 540px; left: 500px;">Tipo del Pokemon</div>
    <div id="pokeitem" class="pokeimg1" style="top: 860px; left: 500px;">Item del Pokemon</div>
    <div id="pokemove1" class="pokeimg1" style="top: 320px; left: 500px;">Movimiento del Pokemon</div>
    <div id="pokemove2" class="pokeimg1" style="top: 510px; left: 500px;">Movimiento del Pokemon</div>
    <div id="pokemove3" class="pokeimg1" style="top: 450px; left: 500px;">Movimiento del Pokemon</div>
    <div id="pokemove4" class="pokeimg1" style="top: 520px; left: 500px;">Movimiento del Pokemon</div>

    <div id="pokeid" class="pokeimg1" style="top: 520px; left: 500px;"></div>
    <div id="pokeorder" class="pokeimg1" style="top: 520px; left: 500px;"></div>

    <button onclick="fetchPokemon()" class="button"></button>
    <div class="grafica">
        <canvas id="miCanvas"></canvas>
    </div>
    <script>
        const fetchPokemon = () => {
            const pokeNameInput = document.getElementById("PokeName");
            let pokeName = pokeNameInput.value.toLowerCase();
            const url = `https://pokeapi.co/api/v2/pokemon/${pokeName}`;
    
            fetch(url).then((res) => {
                if (res.status != 200) {
                    console.log(res);
                } else {
                    return res.json();
                }
            }).then((data) => {
                if (data) {
                    console.log(data);
                    let pokeImg = data.sprites.front_default;
                    pokeImage(pokeImg);
                    
                    let name = document.getElementById('pokename');
                    name.innerHTML = `Name: ${data.forms[0].name}`;
                    let element1 = document.getElementById('pokeHe');
                    element1.innerHTML = `Height: ${data.height}`;
                    let element2 = document.getElementById('pokeWe');
                    element2.innerHTML = `Weight: ${data.weight}`;
                    let element3 = document.getElementById('pokeorder');
                    element3.innerHTML = `Order: ${data.order}`;
                    let element4 = document.getElementById('pokeid');
                    element4.innerHTML = `Id: #${data.id}`;
                    let element5 = document.getElementById('pokeitem');
                    element5.innerHTML = `Ability: ${data.abilities[0].ability.name}`;
                    let element6 = document.getElementById('poketype');
                    element6.innerHTML = `Type: ${data.types[0].type.name}`;
                    let element7 = document.getElementById('pokemove1');
                    element7.innerHTML = `Move 1: ${data.moves[0].move.name}`;
                    let element8 = document.getElementById('pokemove2');
                    element8.innerHTML = `Move 2: ${data.moves[1].move.name}`;
                    let element9 = document.getElementById('pokemove3');
                    element9.innerHTML = `Move 3: ${data.moves[2].move.name}`;
                    let element10 = document.getElementById('pokemove4');
                    element10.innerHTML = `Move 4: ${data.moves[3].move.name}`;
    
                    const miCanvas = document.getElementById("miCanvas").getContext("2d");
                    if (window.miCanva != undefined) {
                        window.miCanva.destroy();
                    }
                    window.miCanva = new Chart(miCanvas, {
                        type: "bar",
                        data: {
                            labels: ["HP", "Attack", "Defense", "Special-A", "Special-D", "Speed"],
                            datasets: [{
                                label: `${data.forms[0].name}`,
                                backgroundColor: 'rgba(154,62,35,1)',
                                data: [
                                    data.stats[0].base_stat,
                                    data.stats[1].base_stat,
                                    data.stats[2].base_stat,
                                    data.stats[3].base_stat,
                                    data.stats[4].base_stat,
                                    data.stats[5].base_stat
                                ],
                                borderColor: [
                                    'rgba(255, 99, 132, 1)',
                                    'rgba(54, 162, 235, 1)',
                                    'rgba(255, 206, 86, 1)',
                                    'rgba(75, 192, 192, 1)',
                                    'rgba(153, 102, 255, 1)',
                                    'rgba(255, 159, 64, 1)'
                                ],
                                backgroundColor: [
                                    'rgba(255, 99, 132, 0.5)',
                                    'rgba(54, 162, 235, 0.5)',
                                    'rgba(255, 206, 86, 0.5)',
                                    'rgba(75, 192, 192, 0.5)',
                                    'rgba(153, 102, 255, 0.5)',
                                    'rgba(255, 159, 64, 0.5)'
                                ],
                                borderWidth: 1,
                            }]
                        },
                        options: {
                            scales: {
                                x: {
                                    ticks: {
                                        maxRotation: 90,
                                        minRotation: 90,
                                        color: 'purple',
                                        font: { size: 15 }
                                    }
                                }
                            }
                        }
                    });
                }
            });
        }
    
        const pokeImage = (url) => {
            const pokePhoto = document.getElementById("pokeImg");
            pokePhoto.src = url;
        }
    </script>2222
